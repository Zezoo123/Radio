name: Test

# Typecheck + unit/golden tests on every push and pull request. The adhoc
# integration suites (test/*.adhoc.test.ts) self-skip when the author's local
# Simian files are absent, so they are no-ops on CI.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
